name = "packet-flight-leaderboard"
main = "src/index.mjs"
compatibility_date = "2026-06-11"
workers_dev = true

[vars]
ENABLED = "true"
ENVIRONMENT = "production"
# pf-3 activated after the compatible backend/schema/CPU checks passed.
ACTIVE_RULESET = "pf-3"
PF3_STARTS = "true"
LEGACY_STARTS = "false"

[[d1_databases]]
binding = "DB"
database_name = "packet-flight"
# Existing production D1, supplied by the operator. Runtime secrets are retained.
database_id = "bc462466-1ed9-41d9-ab75-dc0197d50502"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[observability]
# Aggregate Workers/D1 analytics remain available; do not retain invocation logs.
enabled = false

[env.local.vars]
ENABLED = "true"
ENVIRONMENT = "development"
ACTIVE_RULESET = "pf-3"
PF3_STARTS = "true"
LEGACY_STARTS = "true"
DEV_ORIGINS = "http://127.0.0.1:8000,http://localhost:8000"

[[env.local.d1_databases]]
binding = "DB"
database_name = "packet-flight"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
